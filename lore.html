<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambition – Lore</title>
  <meta name="description" content="The world of Akudia">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/emblem-192.png">
  <meta name="theme-color" content="#120e13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/embeds.js"></script>
  <script src="assets/js/realms.js"></script>
  <script src="assets/js/reader.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head" id="page-head"></div>
    <div id="wip-note"></div>

    <div class="reader" id="reader-top">
      <button class="btn ghost toc-toggle" id="toc-toggle" aria-expanded="false" aria-controls="toc">
        <span>Chapters</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <aside class="toc panel facet" id="toc" aria-label="Chapters"></aside>
      <article class="article panel facet" id="article"><p class="muted">Loading…</p></article>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => Ambition.reader({ base: "content/lore/" }));
  </script>
</body>
</html>
