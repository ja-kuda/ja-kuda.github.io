<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambition – Impressum</title>
  <meta name="description" content="Impressum and terms">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/emblem-192.png">
  <meta name="theme-color" content="#120e13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head"><div><div class="eyebrow">Legal</div><h1>Impressum</h1></div></div>
    <article class="article panel facet"><div class="md" id="impressum"></div></article>
  </main>

  <footer id="site-footer"></footer>

  <script>
    Ambition.loadText("content/impressum.md")
      .then(t => document.getElementById("impressum").innerHTML = Ambition.md(t))
      .catch(e => document.getElementById("impressum").innerHTML = Ambition.errorBox(e));
  </script>
</body>
</html>
