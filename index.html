<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambition – Fantastical stories in Akudia</title>
  <meta name="description" content="Hub for the Ambition pen & paper roleplaying game: rules, characters, map and lore.">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/emblem-192.png">
  <meta name="theme-color" content="#120e13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <div class="shards" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="container">
        <img class="banner" src="assets/img/banner.png" alt="">
        <h1 id="home-title">Ambition</h1>
        <p class="tagline" id="home-tagline"></p>
        <p class="intro" id="home-intro"></p>
      </div>
    </section>

    <div class="container">
      <div id="wip-note"></div>
      <nav class="tiles" id="tiles" aria-label="Sections"></nav>

      <div class="home-grid">
        <section class="panel facet" id="home-about"></section>
        <section class="panel facet">
          <h2>Latest updates</h2>
          <ul class="news" id="news"></ul>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>
    (async () => {
      const A = Ambition;
      try {
        const site = await A.site();
        const home = site.home || {};
        if (home.title) document.getElementById("home-title").textContent = home.title;
        document.getElementById("home-tagline").innerHTML = A.inline(home.tagline || "");
        document.getElementById("home-intro").innerHTML = A.inline(home.intro || "");

        document.getElementById("tiles").innerHTML = (home.tiles || []).map(t => `
          <a class="tile panel facet" href="${t.href}">
            <div class="tile-img"><img src="${t.icon}" alt=""></div>
            <h2>${A.esc(t.title)}</h2>
            <p>${A.inline(t.text)}</p>
            <span class="go">Enter ◆</span>
          </a>`).join("");

        const about = await A.loadText(home.aboutFile || "content/home.md").catch(() => "");
        document.getElementById("home-about").innerHTML = `<div class="md">${A.md(about)}</div>`;

        document.getElementById("news").innerHTML = (site.news || []).map(n =>
          `<li><time>${A.esc(n.date)}</time>${A.inline(n.text)}</li>`).join("") || `<li class="muted">Nothing yet.</li>`;
      } catch (e) {
        document.getElementById("tiles").innerHTML = A.errorBox(e);
      }
    })();
  </script>
</body>
</html>
