<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambition – Fantastical stories in Akudia</title>
  <meta name="description" content="Hub for the Ambition pen & paper roleplaying game: rules, characters, map and lore.">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/emblem-192.png">
  <meta name="theme-color" content="#120e13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <div class="shards" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="container">
        <img class="banner" src="assets/img/banner.png" alt="">
        <h1 id="home-title">Ambition</h1>
        <p class="tagline" id="home-tagline"></p>
        <p class="intro" id="home-intro"></p>
      </div>
    </section>

    <div class="container">
      <div id="wip-note"></div>
      <nav class="tiles" id="tiles" aria-label="Sections"></nav>

      <div class="home-grid">
        <section class="panel facet" id="home-about"></section>
        <section class="panel facet">
          <h2>Latest updates</h2>
          <ul class="news" id="news"></ul>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>
    /* "Latest updates": hand-written entries from site.json → "news" plus the newest commits from GitHub
       (site.json → "updates"). If GitHub can't be reached, only the hand-written entries are shown. */
    async function githubCommits(cfg) {
      if (!cfg || !cfg.github) return [];
      const key = "ambition.commits." + cfg.github;
      try {
        const c = JSON.parse(sessionStorage.getItem(key) || "null");
        if (c && Date.now() - c.t < 10 * 60 * 1000) return c.list;            // cached for 10 minutes
      } catch (e) {}
      const res = await fetch(`https://api.github.com/repos/${cfg.github}/commits?per_page=30`);
      if (!res.ok) throw new Error("GitHub " + res.status);
      const list = (await res.json()).map((c) => ({
        date: (c.commit.committer || c.commit.author).date,
        text: c.commit.message.split("\n")[0].trim(),
        url: c.html_url
      }));
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), list })); } catch (e) {}
      return list;
    }
    async function renderNews(site) {
      const A = Ambition, box = document.getElementById("news");
      const cfg = site.updates || {};
      const draw = (items) => {
        box.innerHTML = items.map((n) => `<li${n.url ? ' class="commit"' : ""}><time>${A.esc(n.day)}</time>${n.url
          ? `<a href="${n.url}" target="_blank" rel="noopener">${A.esc(n.text)}</a>` : A.inline(n.text)}</li>`).join("")
          || `<li class="muted">Nothing yet.</li>`;
      };
      const manual = (site.news || []).map((n) => ({ ...n, sort: String(n.date) + "T00:00:00", day: n.date }));
      const count = cfg.count || 5;     // total number of entries – the oldest drop out
      const merge = (extra) => [...manual, ...extra].sort((a, b) => (a.sort < b.sort ? 1 : -1)).slice(0, count);
      draw(merge([]));
      try {
        const hide = cfg.hidePrefix;
        const commits = (await githubCommits(cfg))
          .filter((c) => c.text && !(hide && c.text.startsWith(hide)) && !/^Merge /.test(c.text))
          .slice(0, count)
          .map((c) => ({ ...c, sort: c.date, day: c.date.slice(0, 10) }));
        if (commits.length) draw(merge(commits));
      } catch (e) { /* offline or GitHub limit reached – keep the hand-written news */ }
    }

    (async () => {
      const A = Ambition;
      try {
        const site = await A.site();
        const home = site.home || {};
        if (home.title) document.getElementById("home-title").textContent = home.title;
        document.getElementById("home-tagline").innerHTML = A.inline(home.tagline || "");
        document.getElementById("home-intro").innerHTML = A.inline(home.intro || "");

        document.getElementById("tiles").innerHTML = (home.tiles || []).map(t => `
          <a class="tile panel facet" href="${t.href}">
            <div class="tile-img"><img src="${t.icon}" alt=""></div>
            <h2>${A.esc(t.title)}</h2>
            <p>${A.inline(t.text)}</p>
            <span class="go">Enter ◆</span>
          </a>`).join("");

        const about = await A.loadText(home.aboutFile || "content/home.md").catch(() => "");
        document.getElementById("home-about").innerHTML = `<div class="md">${A.md(about)}</div>`;

        renderNews(site);
      } catch (e) {
        document.getElementById("tiles").innerHTML = A.errorBox(e);
      }
    })();
  </script>
</body>
</html>
